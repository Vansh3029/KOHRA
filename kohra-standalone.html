<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOHRA - fog-of-war decision trainer</title>
<style>
:root{
  --paper:#DCE4D5; --terrain:#E9EFE3; --terrain2:#D3DDCB; --water:#B7CEDA; --ink:#1B2820; --ink2:#46564B;
  --panel:#F7F9F3; --panel2:#EDF1E7; --line:#BAC5B4; --accent:#B8650F; --accent-ink:#FFFFFF;
  --friendly:#2F6DA3; --hostile:#B93A27; --cyber:#1B7F79; --ok:#3F7A33; --warn:#B8650F; --bad:#B93A27;
  --fog:#F4F6F1; --hatch:#9DAE92;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101914; --terrain:#18241D; --terrain2:#213128; --water:#1F3A47; --ink:#E4ECE1; --ink2:#A4B3A8;
    --panel:#1A261F; --panel2:#223128; --line:#38493F; --accent:#E59A3D; --accent-ink:#1A1208;
    --friendly:#6FA8DC; --hostile:#EE7A66; --cyber:#4CC2B9; --ok:#82C46F; --warn:#E59A3D; --bad:#EE7A66;
    --fog:#2B3A31; --hatch:#42564A;
  }
}
:root[data-theme="dark"]{
  --paper:#101914; --terrain:#18241D; --terrain2:#213128; --water:#1F3A47; --ink:#E4ECE1; --ink2:#A4B3A8;
  --panel:#1A261F; --panel2:#223128; --line:#38493F; --accent:#E59A3D; --accent-ink:#1A1208;
  --friendly:#6FA8DC; --hostile:#EE7A66; --cyber:#4CC2B9; --ok:#82C46F; --warn:#E59A3D; --bad:#EE7A66;
  --fog:#2B3A31; --hatch:#42564A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h3{font-size:15px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--serif);font-style:italic;font-size:22px;letter-spacing:.02em}
.scn{color:var(--ink2);font-size:13px}
.clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;min-width:84px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;background:var(--panel2)}
.pill.run{border-color:var(--ok);color:var(--ok)} .pill.end{border-color:var(--bad);color:var(--bad)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.main{flex:1;min-height:0;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:0}
.muted{color:var(--ink2)}
.small{font-size:12px}

/* lobby */
.lobby{max-width:980px;margin:0 auto;padding:28px 18px 40px}
.lobby h1{font-size:44px;font-style:italic;line-height:1.05}
.lobby .lede{font-size:17px;max-width:62ch;margin:10px 0 22px;color:var(--ink2)}
.lobby .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.lobby label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px}
.role{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.role:hover{border-color:var(--accent)}
.role .rn{font-family:var(--serif);font-size:17px;font-weight:600}
.role .rd{color:var(--ink2);font-size:13px}
.role .who{font-size:12px;color:var(--ok)}
.modeline{margin:0 0 16px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0}

/* trainee */
.trainee{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage rail" "orders rail";gap:10px;padding:10px;height:100%}
.stage{grid-area:stage;position:relative;min-height:240px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.brief{position:absolute;left:10px;top:10px;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;opacity:.96}
.brief b{font-family:var(--serif);font-size:14px}
.brief button{float:right}
.legend{position:absolute;right:10px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.rail{grid-area:rail;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.rail>.panel{flex-shrink:0}
.rail .grow{flex:1 0 auto;min-height:240px;display:flex;flex-direction:column}
.rail .grow .feed{max-height:340px}
.chans{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chans li{display:grid;grid-template-columns:112px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--ok);transition:width .4s}
.bar.mid>span{background:var(--warn)} .bar.low>span{background:var(--bad)}
.chans .age{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;min-width:74px;text-align:right}
.log{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:120px}
.msg{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:6px 8px;background:var(--panel2)}
.msg.ch-radio{border-left-color:var(--friendly)} .msg.ch-datalink{border-left-color:#8A63D2} .msg.ch-cybernet{border-left-color:var(--cyber)} .msg.ch-spectrum{border-left-color:var(--warn)} .msg.ch-teamnet{border-left-color:var(--ink2)}
.msg .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.msg .src{font-weight:600;color:var(--ink)}
.msg .src.unc{color:var(--hostile)}
.msg p{margin:2px 0 0}
.msg .acts{margin-top:4px;display:flex;gap:6px}
.msg.fresh{animation:flash 2.4s ease-out 1}
@keyframes flash{from{background:color-mix(in srgb,var(--accent) 30%,var(--panel2))}to{background:var(--panel2)}}
@media (prefers-reduced-motion:reduce){.msg.fresh{animation:none}.bar>span{transition:none}}
.chatf{display:flex;gap:6px;margin-top:8px}
.chatf input{flex:1;min-width:0}
.orders{grid-area:orders}
.orders .cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:6px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.target{font-size:13px;margin:4px 0}
.warn{color:var(--bad);font-weight:600}
.feedback{min-height:20px;font-size:13px;margin-top:6px}
.feedback.err{color:var(--bad)}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.olist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.olist .st.ok{color:var(--ok)} .olist .st.wait{color:var(--ink2)} .olist .st.noack{color:var(--warn)}

/* instructor */
.instr{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"ctl ctl" "stage rail";gap:10px;padding:10px;height:100%}
.ictl{grid-area:ctl;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ictl .grp{display:flex;gap:6px;align-items:center}
.sliders{display:grid;grid-template-columns:96px repeat(3,1fr);gap:4px 8px;align-items:center;font-size:12px}
.sliders .h{color:var(--ink2)}
.sliders input[type=range]{width:100%;accent-color:var(--accent)}
.injects{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:1px 10px;font-size:12px}
.feed{list-style:none;margin:0;padding:0;overflow:auto;display:grid;gap:6px;font-size:13px}
.feed li{border-bottom:1px dashed var(--line);padding-bottom:4px}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:0 6px;font-weight:600;font-size:12px;color:#fff}
.score.hi{background:var(--ok)} .score.mid{background:var(--warn)} .score.lo{background:var(--bad)} .score.na{background:var(--ink2)}
.tog{display:flex;gap:6px;align-items:center;font-size:13px}

/* AAR */
.aar{max-width:1100px;margin:0 auto;padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 18px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px}
.tile .v{font-family:var(--serif);font-size:30px;line-height:1.1}
.tile .l{color:var(--ink2);font-size:12px}
.aar h2{font-size:22px;margin:22px 0 6px}
.aar table{width:100%;border-collapse:collapse;font-size:13px}
.aar th,.aar td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.aar th{font-weight:600;color:var(--ink2);font-size:12px}
.aar .scroll{overflow-x:auto}
.chart{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.keys i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
.evlist{columns:2;font-size:13px;color:var(--ink2);padding-left:18px}
.exports{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
textarea.raw{width:100%;min-height:120px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.kn{color:var(--ink2);font-size:12px}

@media (max-width:900px){
  .trainee,.instr{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .trainee{grid-template-areas:"stage" "orders" "rail"}
  .instr{grid-template-areas:"ctl" "stage" "rail"}
  .stage{height:62vw;min-height:280px}
  .orders .cols{grid-template-columns:1fr}
  .rail{overflow:visible}
  .evlist{columns:1}
  .legend{display:none}
}
@media print{
  .top,.noprint{display:none!important}
  :root{--paper:#fff;--panel:#fff;--ink:#000;--line:#bbb}
  body{height:auto}
  #app,.main{display:block;height:auto;overflow:visible}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*
 * KOHRA engine - scenario engine, degradation middleware, decision logger, AAR.
 * Pure logic, no I/O. Runs on the Node server (authoritative) and, for the
 * standalone build, inside the browser. UMD: module.exports or window.Kohra.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Kohra = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ------------------------------------------------------------------ constants
  const ROLES = {
    coy:   { label: 'Company Commander',  short: 'Coy Cdr',     orders: ['move', 'fire', 'hold'] },
    air:   { label: 'Air Liaison Officer', short: 'Air Liaison', orders: ['strike', 'recce'] },
    cyber: { label: 'Cyber Officer',       short: 'Cyber',       orders: ['cscan', 'isolate', 'restore'] },
    ew:    { label: 'EW Officer',          short: 'EW',          orders: ['escan', 'hop'] },
  };
  const ROLE_IDS = Object.keys(ROLES);
  const CHANNELS = {
    radio:    { label: 'Radio net' },
    datalink: { label: 'UAV datalink' },
    cybernet: { label: 'Cyber ops net' },
    spectrum: { label: 'Spectrum watch' },
    teamnet:  { label: 'Team net' },
  };
  const CH_IDS = Object.keys(CHANNELS);
  const RATIONALE = [
    'Confirmed by two or more sources',
    'Single report, acting on it',
    'Following HQ intent',
    'Verifying before committing',
    'Time pressure',
    'Reducing risk to own forces',
    'Other',
  ];
  const BLAST = 6;          // fire / strike radius (map units)
  const FIRE_RANGE = 30;    // direct support range of a ground unit
  const STRIKE_FLIGHT = 20; // seconds from tasking received to effect
  const FIRE_PREP = 8;
  const RECCE_FLIGHT = 15;

  // Degradation presets: scale a "contested" baseline.
  const CONTESTED = {
    radio:    { delay: 14, jitter: 0.6, dropout: 0.35, conflict: 0.25, corrupt: 0.05 },
    datalink: { delay: 10, jitter: 0.5, dropout: 0.30, conflict: 0.30, corrupt: 0.10 },
    cybernet: { delay: 8,  jitter: 0.4, dropout: 0.20, conflict: 0.15, corrupt: 0 },
    spectrum: { delay: 6,  jitter: 0.4, dropout: 0.20, conflict: 0.10, corrupt: 0 },
    teamnet:  { delay: 12, jitter: 0.6, dropout: 0.30, conflict: 0.10, corrupt: 0 },
  };
  const PRESETS = { clear: 0, light: 0.35, moderate: 0.7, contested: 1 };
  function presetParams(name) {
    const k = PRESETS[name] == null ? 0.7 : PRESETS[name];
    const out = {};
    CH_IDS.forEach(function (c) {
      const b = CONTESTED[c];
      out[c] = { delay: round1(b.delay * k), jitter: b.jitter, dropout: round2(b.dropout * k), conflict: round2(b.conflict * k), corrupt: round2(b.corrupt * k) };
    });
    return out;
  }

  // ------------------------------------------------------------------ scenario
  const SCENARIO = {
    id: 'ridge-crossing',
    name: 'Op Ridge Crossing',
    brief: 'An enemy armoured column is moving on the bridge from the north. Hold the bridge and destroy the column before it crosses. Your feeds will not all be reliable.',
    duration: 480,
    map: {
      w: 100, h: 60,
      river: { y: 29, h: 4 },
      bridge: { x: 50, y: 31 },
      features: [
        { k: 'ridge', x: 28, y: 10, rx: 12, ry: 5 },
        { k: 'ridge', x: 82, y: 14, rx: 9, ry: 4 },
        { k: 'wood', x: 62, y: 12, rx: 7, ry: 4 },
        { k: 'wood', x: 14, y: 46, rx: 8, ry: 5 },
        { k: 'wood', x: 88, y: 50, rx: 6, ry: 5 },
        { k: 'village', x: 72, y: 47 },
      ],
      labels: [
        { t: 'Ridge North', x: 28, y: 6.5 },
        { t: 'Ridge East', x: 82, y: 10.5 },
        { t: 'Kala', x: 72, y: 52 },
        { t: 'River', x: 8, y: 31.5, water: true },
        { t: 'Bridge', x: 54, y: 27.5 },
      ],
    },
    units: [
      { id: 'A', name: '1 Platoon', x: 30, y: 47, speed: 0.4 },
      { id: 'B', name: 'Mech Platoon', x: 50, y: 50, speed: 0.4 },
      { id: 'C', name: 'Recce Section', x: 72, y: 43, speed: 0.5 },
    ],
    contacts: [
      { id: 'E1', name: 'armour column', path: [[70, 4], [50, 30]], from: 30, to: 390 },
      { id: 'E2', name: 'observation post', pos: [28, 12] },
      { id: 'E3', name: 'artillery battery', pos: [80, 15], appearAt: 120 },
    ],
    sources: [
      { id: 'recce', label: 'Recce', ch: 'radio', kind: 'contacts', cids: ['E1', 'E2'], every: 30, offset: 8, noise: 1.5, to: ['coy', 'air'] },
      { id: 'uav', label: 'UAV', ch: 'datalink', kind: 'contacts', cids: ['E1', 'E2', 'E3'], every: 40, offset: 14, noise: 1.0, to: ['coy', 'air'] },
      { id: 'cyber', label: 'Cyber cell', ch: 'cybernet', kind: 'cyberstatus', every: 45, offset: 20, to: ['cyber', 'coy'] },
      { id: 'ew', label: 'EW cell', ch: 'spectrum', kind: 'ewstatus', every: 45, offset: 25, to: ['ew', 'coy'] },
    ],
    hq: [
      { at: 2,   text: 'HQ: Hold the bridge. Armour expected from the north-east. Destroy it before it crosses.' },
      { at: 200, text: 'HQ: Column expected at the bridge around T+06:30. Confirm positions before committing fires.' },
      { at: 340, text: 'HQ: Report your intentions. Bridge must not fall.' },
    ],
    timeline: [
      { at: 60,  type: 'jam',       ch: 'radio',    dur: 120, strength: 0.9, note: 'Enemy jamming begins on the radio net' },
      { at: 150, type: 'intrusion',                                          note: 'Enemy gains access to the UAV datalink' },
      { at: 210, type: 'spoof',     ch: 'datalink', dur: 90,                  note: 'UAV datalink positions are being spoofed' },
      { at: 300, type: 'jam',       ch: 'datalink', dur: 50,  strength: 0.8, note: 'Enemy jamming begins on the UAV datalink' },
    ],
  };

  // Scripted "demo trainee" plan; positions resolve from what the role believes.
  const DEMO_PLAN = [
    { at: 38,  role: 'air',   type: 'recce',  target: 'E1', rationale: 'Verifying before committing', note: 'Asking for a UAV look at the column before tasking anything.' },
    { at: 55,  role: 'coy',   chat: 'Recce and UAV both show the column heading for the bridge. Holding fires until it is closer.' },
    { at: 100, role: 'ew',    type: 'hop',    rationale: 'Time pressure', note: 'Radio is full of noise. Hopping frequency.' },
    { at: 130, role: 'coy',   type: 'move',   unit: 'B', pos: [50, 37], rationale: 'Following HQ intent', note: 'Mech platoon covers the bridge from the south.' },
    { at: 222, role: 'air',   type: 'strike', target: 'E1', rationale: 'Single report, acting on it', note: 'Latest UAV fix is fresh. Tasking CAS now.' },
    { at: 232, role: 'cyber', type: 'isolate', rationale: 'Reducing risk to own forces', note: 'Datalink looks wrong. Isolating it.' },
    { at: 285, role: 'air',   type: 'recce',  target: 'E1', rationale: 'Verifying before committing', note: 'Strike result unclear. Requesting a fresh look.' },
    { at: 320, role: 'cyber', type: 'restore', rationale: 'Following HQ intent', note: 'Datalink needed for the final engagement.' },
    { at: 338, role: 'coy',   type: 'fire',   unit: 'B', target: 'E1', rationale: 'Confirmed by two or more sources', note: 'Recce and UAV agree on the column position.' },
  ];

  // ------------------------------------------------------------------ helpers
  function round1(v) { return Math.round(v * 10) / 10; }
  function round2(v) { return Math.round(v * 100) / 100; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gridRef(p) {
    const col = String.fromCharCode(65 + clamp(Math.floor(p[0] / 10), 0, 9));
    const row = clamp(Math.floor(p[1] / 10), 0, 5) + 1;
    return col + row;
  }
  function fmtT(t) {
    t = Math.max(0, Math.floor(t));
    const m = Math.floor(t / 60), s = t % 60;
    return 'T+' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ------------------------------------------------------------------ engine
  function createEngine(opts) {
    opts = opts || {};
    const scenario = opts.scenario || SCENARIO;
    const players = {};        // role -> [names]; survives reset
    let S;

    function init(seed, preset, keep) {
      keep = keep || {};
      S = {
        seed: seed,
        rng: mulberry32(seed),
        t: 0, running: false, speed: keep.speed || 1, ended: false, endReason: '', outcome: 'incomplete',
        scripted: keep.scripted !== false, demo: false,
        preset: preset, params: presetParams(preset),
        effects: [], mitigations: [], isolation: null, intrusion: null,
        units: {}, contacts: {},
        queue: [], execQ: [],
        next: {}, tlDone: {}, hqDone: {}, demoDone: {},
        mid: 0, did: 0, eid: 0,
        inbox: {}, dlog: [], decisions: [], events: [], series: {}, lastSample: -999, chat: 0,
      };
      scenario.units.forEach(function (u) { S.units[u.id] = { id: u.id, name: u.name, x: u.x, y: u.y, tx: null, ty: null, speed: u.speed, alive: true }; });
      scenario.contacts.forEach(function (c) {
        const p0 = c.path ? c.path[0] : c.pos;
        S.contacts[c.id] = { id: c.id, name: c.name, x: p0[0], y: p0[1], alive: true, path: c.path || null, from: c.from, to: c.to, appearAt: c.appearAt || 0 };
      });
      scenario.sources.forEach(function (s) { S.next[s.id] = s.offset; });
      ROLE_IDS.forEach(function (r) { S.inbox[r] = []; S.series[r] = []; });
      logEvent('Exercise prepared: ' + scenario.name + ' (' + preset + ' degradation, seed ' + seed + ')', 'info');
    }

    function logEvent(text, kind) { S.events.push({ id: ++S.eid, t: round1(S.t), text: text, kind: kind || 'info' }); }

    // ---------------------------------------------------- degradation middleware
    function effective(ch) {
      const b = S.params[ch];
      const d = { delay: b.delay, jitter: b.jitter, dropout: b.dropout, conflict: b.conflict, corrupt: b.corrupt, spoof: false, jammed: false };
      S.effects.forEach(function (e) {
        if (e.ch !== ch || S.t < e.start || S.t >= e.end) return;
        if (e.kind === 'jam') {
          let k = e.strength;
          if (S.mitigations.some(function (m) { return m.ch === ch && S.t < m.until; })) k *= 0.35;
          d.dropout = Math.max(d.dropout, 0.9 * k);
          d.delay += 18 * k;
          d.jitter = Math.max(d.jitter, 0.5);
          d.jammed = true;
        } else if (e.kind === 'outage') { d.dropout = 1; d.jammed = true; }
        else if (e.kind === 'spoof') { d.spoof = true; }
      });
      if (S.isolation && S.t < S.isolation.until && ch === 'datalink') { d.dropout = 1; }
      return d;
    }
    function sampleDelay(e) {
      if (e.delay <= 0) return 0;
      return Math.max(0, e.delay * (1 + (S.rng() * 2 - 1) * e.jitter));
    }
    function jitterPos(p, mag) {
      const a = S.rng() * Math.PI * 2, r = S.rng() * mag;
      return [p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r];
    }

    // Route one truth message to one recipient through the channel degradation.
    function route(msg, role) {
      const e = effective(msg.ch);
      const entry = { id: 'L' + (S.dlog.length + 1), role: role, ch: msg.ch, msgId: msg.id, sentAt: round1(msg.sentAt), outcome: 'pending', delay: 0, recvAt: null, flags: [] };
      S.dlog.push(entry);
      if (S.rng() < e.dropout) { entry.outcome = 'dropped'; return; }
      const delay = sampleDelay(e);
      entry.delay = round1(delay);
      let m = msg;
      const hasPos = msg.data && msg.data.pos && msg.data.kind === 'contact';
      if (hasPos && e.spoof) {
        m = clone(msg); m.data.pos = [m.data.pos[0] + 16, m.data.pos[1] + 12]; entry.flags.push('spoofed');
      } else if (hasPos && e.corrupt > 0 && S.rng() < e.corrupt) {
        m = clone(msg); m.data.pos = jitterPos(m.data.pos, 10); entry.flags.push('corrupted');
      }
      S.queue.push({ at: S.t + delay, role: role, msg: m, entry: entry, flags: entry.flags.slice() });
      if (S.rng() < e.conflict) {
        const v = clone(msg);
        v.id = msg.id + 'x'; v.src = 'Unconfirmed source';
        if (hasPos) {
          const a = S.rng() * Math.PI * 2, r = 10 + S.rng() * 8;
          v.data.pos = [clamp(msg.data.pos[0] + Math.cos(a) * r, 2, 98), clamp(msg.data.pos[1] + Math.sin(a) * r, 2, 58)];
          v.text = cap(scenarioContactName(msg.data.cid) || 'contact') + ' in ' + gridRef(v.data.pos) + '.';
        } else if (msg.data && msg.data.kind === 'status') {
          v.data.ok = !msg.data.ok;
          v.text = msg.data.ok ? 'Signs of interference on the net.' : 'All nets look normal.';
        } else { return; }
        const e2 = { id: 'L' + (S.dlog.length + 1), role: role, ch: msg.ch, msgId: v.id, sentAt: round1(msg.sentAt), outcome: 'pending', delay: round1(delay + S.rng() * 10), recvAt: null, flags: ['conflicting'] };
        S.dlog.push(e2);
        S.queue.push({ at: S.t + e2.delay, role: role, msg: v, entry: e2, flags: ['conflicting'] });
      }
    }
    function scenarioContactName(cid) { const c = S.contacts[cid]; return c ? c.name : null; }

    function emit(spec) {
      const msg = { id: 'M' + (++S.mid), ch: spec.ch, src: spec.src, sentAt: S.t, text: spec.text, data: spec.data || {} };
      (spec.to || []).forEach(function (r) {
        if (spec.local) deliverNow(r, msg, spec.ch, []);
        else route(msg, r);
      });
      return msg;
    }
    function deliverNow(role, msg, ch, flags) {
      const rec = clone(msg);
      rec.recvAt = S.t; rec._meta = { flags: flags || [] };
      S.inbox[role].push(rec);
      afterDeliver(role, rec);
    }
    function afterDeliver(role, rec) {
      const d = rec.data || {};
      if (d.did) {
        const dec = S.decisions.find(function (x) { return x.id === d.did; });
        if (dec && dec.ackedAt == null) dec.ackedAt = round1(S.t);
        if (dec && d.kind === 'bda' && dec.bdaAt == null) dec.bdaAt = round1(S.t);
      }
      if (d.kind === 'chat' && d.share && d.share.pos) {
        S.inbox[role].push({ id: rec.id + 's', ch: rec.ch, src: 'Relayed by ' + (d.fromShort || 'team'), sentAt: d.share.sentAt, recvAt: S.t, text: '', hidden: true,
          data: { kind: 'contact', cid: d.share.cid, pos: d.share.pos }, _meta: { flags: ['relay'] } });
      }
    }

    // ---------------------------------------------------- beliefs / knowledge
    function beliefs(role) {
      const map = {};
      S.inbox[role].forEach(function (m) {
        if (!(m.data && m.data.pos && m.data.cid)) return;
        const k = m.src + '|' + m.data.cid;
        if (!map[k] || m.sentAt > map[k].sentAt) map[k] = { cid: m.data.cid, src: m.src, pos: m.data.pos, sentAt: m.sentAt, recvAt: m.recvAt };
      });
      return Object.keys(map).map(function (k) { return map[k]; });
    }
    function latestBelief(role, cid) {
      let best = null;
      beliefs(role).forEach(function (b) { if (b.cid === cid && (!best || b.sentAt > best.sentAt)) best = b; });
      return best;
    }
    function knowledge(role, pos, cid) {
      const reps = [];
      S.inbox[role].forEach(function (m) {
        if (!(m.data && m.data.pos && m.data.kind === 'contact')) return;
        if (cid && m.data.cid !== cid) return;
        if (S.t - m.sentAt > 120) return;
        reps.push(m);
      });
      let sup = 0, con = 0, freshest = null, recentSup = 0, recentCon = 0;
      reps.forEach(function (m) {
        const age = S.t - m.sentAt, w = Math.exp(-age / 60), d = dist(m.data.pos, pos);
        if (d <= 8) { sup += w; if (age < 60) recentSup++; }
        else if (d > 12) { con += w; if (age < 60) recentCon++; }
        if (freshest == null || age < freshest) freshest = age;
      });
      let conf = sup / (sup + con + 0.4);
      if (freshest == null || freshest > 90) conf *= 0.6;
      let truthPos = null;
      if (cid && S.contacts[cid]) truthPos = [S.contacts[cid].x, S.contacts[cid].y];
      else {
        let bd = 1e9;
        Object.keys(S.contacts).forEach(function (k) { const c = S.contacts[k]; if (!c.alive) return; const d = dist([c.x, c.y], pos); if (d < bd) { bd = d; truthPos = [c.x, c.y]; } });
      }
      return {
        reports: reps.length,
        freshestAge: freshest == null ? null : round1(freshest),
        contradictory: recentSup > 0 && recentCon > 0,
        confidence: round2(conf),
        believedPos: pos.map(round1),
        truthPos: truthPos ? truthPos.map(round1) : null,
        beliefError: truthPos ? round1(dist(pos, truthPos)) : null,
      };
    }

    // ---------------------------------------------------- orders
    function describe(d) {
      const a = d.args;
      switch (d.type) {
        case 'move': return 'Move ' + unitName(a.unit) + ' to ' + gridRef(a.pos);
        case 'hold': return 'Hold ' + unitName(a.unit) + ' in place';
        case 'fire': return unitName(a.unit) + ' fire at ' + gridRef(a.pos) + (a.cid ? ' (reported ' + a.cid + ')' : '');
        case 'strike': return 'Air strike on ' + gridRef(a.pos) + (a.cid ? ' (reported ' + a.cid + ')' : '');
        case 'recce': return 'UAV recce of ' + gridRef(a.pos) + (a.cid ? ' (looking for ' + a.cid + ')' : '');
        case 'cscan': return 'Scan networks for intrusion';
        case 'isolate': return 'Isolate the UAV datalink';
        case 'restore': return 'Restore the UAV datalink';
        case 'escan': return 'Scan the spectrum';
        case 'hop': return 'Frequency hop on the radio net';
      }
      return d.type;
    }
    function unitName(id) { const u = S.units[id]; return u ? u.name : 'unit'; }

    function order(role, ord, rationale) {
      if (!ROLES[role]) return { ok: false, error: 'Unknown role.' };
      if (S.ended) return { ok: false, error: 'The exercise has ended.' };
      if (!S.running) return { ok: false, error: 'The exercise is paused.' };
      if (!ord || ROLES[role].orders.indexOf(ord.type) < 0) return { ok: false, error: 'That order is not available to your role.' };
      rationale = rationale || {};
      if (RATIONALE.indexOf(rationale.tag) < 0) return { ok: false, error: 'Choose a rationale before sending.' };
      const a = { unit: ord.unit || null, pos: null, cid: ord.cid || null };
      const needsPos = ['move', 'fire', 'strike', 'recce'].indexOf(ord.type) >= 0;
      if (needsPos) {
        if (!Array.isArray(ord.pos) || ord.pos.length !== 2 || !isFinite(ord.pos[0]) || !isFinite(ord.pos[1])) return { ok: false, error: 'Pick a target on the map first.' };
        a.pos = [clamp(+ord.pos[0], 0, scenario.map.w), clamp(+ord.pos[1], 0, scenario.map.h)];
      }
      if (['move', 'fire', 'hold'].indexOf(ord.type) >= 0 && !S.units[a.unit]) return { ok: false, error: 'Choose a unit.' };
      if (a.unit && !S.units[a.unit].alive) return { ok: false, error: S.units[a.unit].name + ' is no longer operational.' };
      if (a.cid && !S.contacts[a.cid]) a.cid = null;
      const d = {
        id: 'D' + (++S.did), t: round1(S.t), role: role, type: ord.type, args: a, text: '',
        rationale: { tag: rationale.tag, note: String(rationale.note || '').slice(0, 200) },
        knowledge: null, status: 'sent', transit: 0, execAt: null, outcome: null, score: null, label: null, ackedAt: null, bdaAt: null, auto: !!ord.auto,
      };
      d.text = describe(d);
      if (needsPos && (ord.type === 'fire' || ord.type === 'strike' || ord.type === 'recce')) d.knowledge = knowledge(role, a.pos, a.cid);
      else if (needsPos) d.knowledge = knowledge(role, a.pos, null);
      S.decisions.push(d);
      const chOut = role === 'coy' ? 'radio' : role === 'air' ? 'datalink' : null;
      if (chOut) {
        const e = effective(chOut);
        if (S.rng() < e.dropout) { d.status = 'lost'; d.outcome = { kind: 'lost', detail: 'The order never reached its destination.' }; finish(d); logEvent(ROLES[role].short + ' order lost in transit: ' + d.text, 'loss'); return { ok: true, id: d.id }; }
        const delay = sampleDelay(e);
        const proc = d.type === 'strike' ? STRIKE_FLIGHT : d.type === 'fire' ? FIRE_PREP : d.type === 'recce' ? RECCE_FLIGHT : 0;
        d.transit = round1(delay);
        d.execAt = S.t + delay + proc;
        S.execQ.push({ at: d.execAt, d: d, transitEnd: S.t + delay });
      } else {
        d.execAt = S.t; d.transit = 0;
        execute(d);
      }
      return { ok: true, id: d.id };
    }

    function ackTo(d, text, kind, ch) {
      emit({ ch: ch, src: kind === 'bda' ? 'BDA' : 'Unit ack', text: text, data: { kind: kind, did: d.id }, to: [d.role] });
    }
    function resolveFire(d, pos, srcId) {
      const killed = [], hitOwn = [];
      Object.keys(S.contacts).forEach(function (k) {
        const c = S.contacts[k];
        if (c.alive && (!c.appearAt || S.t >= c.appearAt) && dist([c.x, c.y], pos) <= BLAST) { c.alive = false; killed.push(k); }
      });
      Object.keys(S.units).forEach(function (k) {
        const u = S.units[k];
        if (u.alive && k !== srcId && dist([u.x, u.y], pos) <= BLAST) { u.alive = false; u.tx = u.ty = null; hitOwn.push(k); }
      });
      let kind = 'miss';
      if (hitOwn.length) kind = 'fratricide';
      else if (d.args.cid && killed.indexOf(d.args.cid) >= 0) kind = 'hit';
      else if (killed.length) kind = 'hit_other';
      const gr = gridRef(pos);
      let detail;
      if (kind === 'fratricide') detail = 'Friendly forces hit in ' + gr + ': ' + hitOwn.map(unitName).join(', ') + (killed.length ? '; enemy also destroyed' : '');
      else if (kind === 'hit') detail = 'Target destroyed in ' + gr;
      else if (kind === 'hit_other') detail = killed.map(scenarioContactName).join(', ') + ' destroyed in ' + gr + ' (not the reported target)';
      else detail = 'No enemy in ' + gr + ' at time of impact';
      d.outcome = { kind: kind, detail: detail, killed: killed, hitOwn: hitOwn, pos: pos.map(round1) };
      killed.forEach(function (k) { logEvent(scenarioContactName(k) + ' (' + k + ') destroyed in ' + gr, 'good'); });
      if (hitOwn.length) logEvent('FRATRICIDE in ' + gr + ': ' + hitOwn.map(unitName).join(', '), 'bad');
      return kind;
    }
    function reportText(kind, d, pos) {
      const gr = gridRef(pos);
      if (kind === 'fratricide') return 'ALERT: friendly casualties in ' + gr + ' after our fire.';
      if (kind === 'hit') return 'BDA: target destroyed in ' + gr + '.';
      if (kind === 'hit_other') return 'BDA: a different enemy element was destroyed in ' + gr + '. Reported target not hit.';
      return 'BDA: no enemy seen in ' + gr + '.';
    }

    function execute(d) {
      d.status = 'executed';
      const a = d.args;
      switch (d.type) {
        case 'move': {
          const u = S.units[a.unit];
          if (!u.alive) { d.outcome = { kind: 'void', detail: u.name + ' was already out of action.' }; break; }
          u.tx = a.pos[0]; u.ty = a.pos[1];
          d.outcome = { kind: 'executed', detail: u.name + ' moving to ' + gridRef(a.pos) };
          ackTo(d, u.name + ': moving to ' + gridRef(a.pos) + '.', 'ack', 'radio');
          break;
        }
        case 'hold': {
          const u = S.units[a.unit]; u.tx = u.ty = null;
          d.outcome = { kind: 'executed', detail: u.name + ' holding' };
          ackTo(d, u.name + ': holding position.', 'ack', 'radio');
          break;
        }
        case 'fire': {
          const u = S.units[a.unit];
          if (!u.alive) { d.outcome = { kind: 'void', detail: u.name + ' was already out of action.' }; break; }
          if (dist([u.x, u.y], a.pos) > FIRE_RANGE) {
            d.outcome = { kind: 'out_of_range', detail: u.name + ' could not reach ' + gridRef(a.pos) };
            ackTo(d, u.name + ': target out of range, no fire.', 'ack', 'radio');
            break;
          }
          const k = resolveFire(d, a.pos, a.unit);
          ackTo(d, k === 'fratricide' ? reportText(k, d, a.pos) : u.name + ': fired on ' + gridRef(a.pos) + '. ' + reportText(k, d, a.pos), 'bda', 'radio');
          break;
        }
        case 'strike': {
          const k = resolveFire(d, a.pos, null);
          ackTo(d, k === 'fratricide' ? reportText(k, d, a.pos) : 'CAS: strike complete on ' + gridRef(a.pos) + '. ' + reportText(k, d, a.pos), 'bda', 'datalink');
          break;
        }
        case 'recce': {
          let n = 0;
          Object.keys(S.contacts).forEach(function (k) {
            const c = S.contacts[k];
            if (!c.alive || (c.appearAt && S.t < c.appearAt) || dist([c.x, c.y], a.pos) > 15) return;
            n++;
            const p = jitterPos([c.x, c.y], 0.6);
            emit({ ch: 'datalink', src: 'UAV recce', text: 'UAV recce: ' + c.name + ' in ' + gridRef(p), data: { kind: 'contact', cid: k, pos: p, did: d.id }, to: [d.role] });
          });
          if (!n) emit({ ch: 'datalink', src: 'UAV recce', text: 'UAV recce: no contacts near ' + gridRef(a.pos) + '.', data: { kind: 'bda', did: d.id }, to: [d.role] });
          d.outcome = { kind: 'executed', detail: n ? n + ' contact(s) observed near ' + gridRef(a.pos) : 'Nothing found near ' + gridRef(a.pos) };
          break;
        }
        case 'cscan': {
          const bad = S.intrusion && !S.intrusion.cleared;
          emit({ ch: 'cybernet', src: 'Scan result', text: bad ? 'Scan: unauthorised access found on the UAV datalink.' : 'Scan: no intrusion found.', data: { kind: 'status', ok: !bad }, to: [d.role], local: true });
          d.outcome = { kind: 'executed', detail: bad ? 'Intrusion found' : 'Clean' };
          break;
        }
        case 'isolate': {
          S.isolation = { until: S.t + 45 };
          const bad = S.intrusion && !S.intrusion.cleared;
          if (bad) { S.intrusion.cleared = true; S.effects = S.effects.filter(function (e) { return e.kind !== 'spoof'; }); }
          d.outcome = bad ? { kind: 'contained', detail: 'Intrusion contained; datalink dark for 45 s' } : { kind: 'unneeded', detail: 'No intrusion present; datalink dark for 45 s' };
          emit({ ch: 'cybernet', src: 'Cyber ops', text: 'Datalink isolated for 45 s.', data: { kind: 'status', ok: true }, to: [d.role], local: true });
          logEvent(bad ? 'Datalink isolated, intrusion contained' : 'Datalink isolated with no intrusion present', bad ? 'good' : 'info');
          break;
        }
        case 'restore': {
          S.isolation = null;
          d.outcome = { kind: 'executed', detail: 'Datalink restored' };
          emit({ ch: 'cybernet', src: 'Cyber ops', text: 'Datalink restored.', data: { kind: 'status', ok: true }, to: [d.role], local: true });
          break;
        }
        case 'escan': {
          const jam = ['radio', 'datalink'].filter(function (c) { return effective(c).jammed; });
          emit({ ch: 'spectrum', src: 'Scan result', text: jam.length ? 'Scan: jamming on ' + jam.map(function (c) { return CHANNELS[c].label; }).join(' and ') + '.' : 'Scan: spectrum clear.', data: { kind: 'status', ok: !jam.length }, to: [d.role], local: true });
          d.outcome = { kind: 'executed', detail: jam.length ? 'Jamming found' : 'Clear' };
          break;
        }
        case 'hop': {
          const jam = effective('radio').jammed;
          S.mitigations.push({ ch: 'radio', until: S.t + 60 });
          d.outcome = jam ? { kind: 'effective', detail: 'Hop reduces jamming on the radio net for 60 s' } : { kind: 'unneeded', detail: 'No jamming present; hop is wasted' };
          emit({ ch: 'spectrum', src: 'EW ops', text: 'Frequency hop on the radio net, good for 60 s.', data: { kind: 'status', ok: true }, to: [d.role], local: true });
          break;
        }
      }
      finish(d);
    }

    function finish(d) {
      const k = d.knowledge, o = d.outcome || { kind: 'void' };
      let q = 70, label = 'Routine';
      switch (d.type) {
        case 'fire':
        case 'strike': {
          const c = k ? k.confidence : 0.3;
          const oScore = { hit: 1, hit_other: 0.8, miss: 0.5, out_of_range: 0.4, lost: 0.45, void: 0.5, fratricide: 0 }[o.kind];
          q = 100 * (0.6 * (oScore == null ? 0.5 : oScore) + 0.4 * c);
          if (o.kind === 'fratricide') label = c < 0.5 ? 'Fratricide on weak information' : 'Fratricide despite good information';
          else if (o.kind === 'hit') label = c >= 0.5 ? 'Sound decision' : 'Right result, thin information';
          else if (o.kind === 'hit_other') label = 'Hit the wrong element';
          else if (o.kind === 'lost') label = 'Order lost in transit';
          else if (o.kind === 'out_of_range') label = 'Unit could not reach the target';
          else label = c >= 0.5 ? 'Good information, target had moved' : 'Acted on weak information';
          break;
        }
        case 'recce': {
          const c = k ? k.confidence : 0.3;
          q = o.kind === 'lost' ? 45 : 100 * (0.45 + 0.55 * (1 - c));
          label = o.kind === 'lost' ? 'Order lost in transit' : c < 0.5 ? 'Verified under doubt' : 'Verification was not needed';
          break;
        }
        case 'isolate': q = o.kind === 'contained' ? 92 : 40; label = o.kind === 'contained' ? 'Contained the intrusion' : 'Isolated with no intrusion'; break;
        case 'hop': q = o.kind === 'effective' ? 90 : 45; label = o.kind === 'effective' ? 'Mitigated jamming' : 'Hop was not needed'; break;
        case 'move': case 'hold': if (o.kind === 'lost') { q = 40; label = 'Order lost in transit'; } break;
        default: break;
      }
      d.score = Math.round(clamp(q, 0, 100));
      d.label = label;
    }

    // ---------------------------------------------------- injected effects
    function addEffect(e) { e.id = 'F' + (S.effects.length + 1); S.effects.push(e); return e; }
    function inject(spec) {
      const ch = CH_IDS.indexOf(spec.ch) >= 0 ? spec.ch : 'radio';
      const dur = clamp(+spec.dur || 60, 5, 300);
      switch (spec.kind) {
        case 'jam': addEffect({ kind: 'jam', ch: ch, start: S.t, end: S.t + dur, strength: clamp(+spec.strength || 0.9, 0.1, 1), src: 'instructor' }); logEvent('Instructor: jamming on ' + CHANNELS[ch].label + ' for ' + dur + ' s', 'degrade'); break;
        case 'outage': addEffect({ kind: 'outage', ch: ch, start: S.t, end: S.t + dur, src: 'instructor' }); logEvent('Instructor: ' + CHANNELS[ch].label + ' cut for ' + dur + ' s', 'degrade'); break;
        case 'spoof': addEffect({ kind: 'spoof', ch: 'datalink', start: S.t, end: S.t + dur, src: 'instructor' }); logEvent('Instructor: UAV datalink positions spoofed for ' + dur + ' s', 'degrade'); break;
        case 'intrusion': S.intrusion = { start: S.t, detected: false, detectAt: S.t + 15, cleared: false }; logEvent('Instructor: enemy gains access to the UAV datalink', 'degrade'); break;
        case 'clear': S.effects = []; S.intrusion = null; S.isolation = null; logEvent('Instructor: all active effects cleared', 'info'); break;
        default: return { ok: false, error: 'Unknown event.' };
      }
      return { ok: true };
    }

    // ---------------------------------------------------- simulation step
    function step(h) {
      if (S.ended) { S.running = false; return; }
      S.t += h;
      // scripted timeline
      if (S.scripted) {
        scenario.timeline.forEach(function (ev, i) {

    function emitSource(src) {

          const moving = c.path && S.t > c.from && S.t < c.to;
          emit({ ch: src.ch, src: src.label, text: src.label + ': ' + c.name + ' in ' + gridRef(p) + (moving ? ', moving' : ', static'), data: { kind: 'contact', cid: cid, pos: p }, to: src.to });

        emit({ ch: src.ch, src: src.label, text: bad ? 'Cyber cell: anomalous traffic on the UAV datalink. Integrity suspect.' : 'Cyber cell: networks nominal.', data: { kind: 'status', ok: !bad }, to: src.to });
      } else if (src.kind === 'ewstatus') {
        const jam = ['radio', 'datalink'].filter(function (c) { return effective(c).jammed; });
        emit({ ch: src.ch, src: src.label, text: jam.length ? 'EW cell: noise floor high on ' + jam.map(function (c) { return CHANNELS[c].label; }).join(' and ') + '. Probable jamming.' : 'EW cell: spectrum clear.', data: { kind: 'status', ok: !jam.length }, to: src.to });
      }
    }

    // demo bot ------------------------------------------------------------
    function runDemo() {
      DEMO_PLAN.forEach(function (p, i) {
        if (S.t < p.at || S.demoDone[i]) return;
        S.demoDone[i] = true;
        if (p.chat) { chat(p.role, p.chat, null); return; }
        const ord = { type: p.type, unit: p.unit || null, auto: true };
        if (p.target) {
          const b = latestBelief(p.role, p.target) || latestBelief('coy', p.target) || latestBelief('air', p.target);
          if (b) { ord.pos = b.pos.slice(); ord.cid = p.target; }
        }
        if (p.pos) ord.pos = p.pos;
        if (['move', 'fire', 'strike', 'recce'].indexOf(p.type) >= 0 && !ord.pos) return;
        order(p.role, ord, { tag: p.rationale, note: p.note });
      });
    }

    // ---------------------------------------------------- team chat
    function chat(role, text, share) {
      text = String(text || '').trim().slice(0, 240);
      if (!ROLES[role] || !text) return { ok: false };
      const data = { kind: 'chat', fromShort: ROLES[role].short };
      if (share && share.pos && isFinite(share.pos[0]) && isFinite(share.pos[1])) data.share = { cid: share.cid || null, pos: [+share.pos[0], +share.pos[1]], sentAt: +share.sentAt || S.t };
      const msg = { id: 'M' + (++S.mid), ch: 'teamnet', src: ROLES[role].short, sentAt: S.t, text: text, data: data };
      const own = clone(msg); own.recvAt = S.t; own._meta = { flags: [] }; own.mine = true;

    }

    // ---------------------------------------------------- views
    function playerRoster() {
      const o = {};
      ROLE_IDS.forEach(function (r) { o[r] = (players[r] || []).slice(); });
      return o;
    }
    function sceneInfo() {
      return { id: scenario.id, name: scenario.name, brief: scenario.brief, duration: scenario.duration, map: scenario.map,
        roles: ROLES, channels: CHANNELS, rationale: RATIONALE, blast: BLAST, fireRange: FIRE_RANGE, units: scenario.units.map(function (u) { return { id: u.id, name: u.name }; }) };
    }
    function viewFor(role) {
      const msgs = S.inbox[role].filter(function (m) { return !m.hidden; }).slice(-70).map(function (m) {
        return { id: m.id, ch: m.ch, src: m.src, sentAt: round1(m.sentAt), recvAt: round1(m.recvAt), text: m.text, data: m.data && m.data.pos ? { cid: m.data.cid, pos: m.data.pos, kind: m.data.kind } : { kind: m.data && m.data.kind }, mine: !!m.mine };
      });

      S.inbox[role].forEach(function (m) { if (!m.mine) lastHeard[m.ch] = m.recvAt; });
      const chans = CH_IDS.map(function (c) { return { ch: c, lastHeard: lastHeard[c] == null ? null : round1(lastHeard[c]) }; });
      const orders = S.decisions.filter(function (d) { return d.role === role; }).slice(-6).map(function (d) {
        return { id: d.id, t: d.t, text: d.text, ackedAt: d.ackedAt, bdaAt: d.bdaAt, rationale: d.rationale.tag };
      });
      const sc = ROLES[role].orders.indexOf('hop') >= 0 ? { hop: S.mitigations.some(function (m) { return S.t < m.until; }) } : {};
      return {
        kind: 'trainee', role: role, t: round1(S.t), running: S.running, ended: S.ended, endReason: S.endReason, speed: S.speed,
        units: Object.keys(S.units).map(function (k) { const u = S.units[k]; return { id: u.id, name: u.name, x: round1(u.x), y: round1(u.y), tx: u.tx, ty: u.ty, alive: u.alive }; }),
        contacts: beliefs(role).map(function (b) { return { cid: b.cid, src: b.src, pos: [round1(b.pos[0]), round1(b.pos[1])], sentAt: round1(b.sentAt), recvAt: round1(b.recvAt) }; }),
        messages: msgs, channels: chans, orders: orders, status: sc, roster: playerRoster(),
        isolated: role === 'cyber' ? !!(S.isolation && S.t < S.isolation.until) : undefined,

    }
    function stats() {
      const per = {}, byCh = {};
      ROLE_IDS.forEach(function (r) { per[r] = { delivered: 0, dropped: 0 }; });
      CH_IDS.forEach(function (c) { byCh[c] = { attempts: 0, delivered: 0, dropped: 0, delayed: 0, sumDelay: 0, conflicting: 0, spoofed: 0, corrupted: 0 }; });
      S.dlog.forEach(function (l) {
        const c = byCh[l.ch];

          c.attempts++;
          if (l.outcome === 'dropped') { c.dropped++; per[l.role].dropped++; }

        } else { c.conflicting++; }

    function activeEffects() {
      return S.effects.filter(function (e) { return S.t >= e.start && S.t < e.end; }).map(function (e) { return { id: e.id, kind: e.kind, ch: e.ch, left: round1(e.end - S.t), src: e.src }; })
        .concat(S.isolation && S.t < S.isolation.until ? [{ id: 'iso', kind: 'isolation', ch: 'datalink', left: round1(S.isolation.until - S.t), src: 'cyber' }] : [])

    function instructorView() {
      const beliefsE1 = {};

      const eff = {};

        kind: 'instructor', t: round1(S.t), running: S.running, ended: S.ended, endReason: S.endReason, outcome: S.outcome, speed: S.speed, scripted: S.scripted, demo: S.demo,
        preset: S.preset, params: S.params, effective: eff, effects: activeEffects(), seed: S.seed,
        intrusion: S.intrusion ? { detected: S.intrusion.detected, cleared: S.intrusion.cleared } : null,

        contacts: Object.keys(S.contacts).map(function (k) { const c = S.contacts[k]; return { id: c.id, name: c.name, x: round1(c.x), y: round1(c.y), alive: c.alive, hidden: !!(c.appearAt && S.t < c.appearAt) }; }),

    // ---------------------------------------------------- AAR

        meta: { scenario: scenario.name, seed: S.seed, preset: S.preset, scripted: S.scripted, duration: round1(S.t), limit: scenario.duration, ended: S.ended, demo: S.demo },

    // ---------------------------------------------------- public API

    return {
      scenario: scenario,
      scene: sceneInfo,
      state: function () { return S; },
      advance: function (dtReal) {
        if (!S.running) return;

      start: function () { if (!S.ended) { S.running = true; if (S.t === 0) logEvent('Exercise started', 'info'); } },
      pause: function () { S.running = false; },

      setScripted: function (v) { S.scripted = !!v; },

      setPreset: function (name) { if (PRESETS[name] == null) return; S.preset = name; S.params = presetParams(name); logEvent('Degradation preset: ' + name, 'degrade'); },

  // ------------------------------------------------------------------ room
  // Transport-agnostic session manager. A client is { id, send(obj) }.

        if (!role) return sendTo(c, { t: 'error', text: 'Unknown role.' });
        if (c.role && c.role !== 'instructor') eng.removePlayer(c.role, c.name);
        c.role = role; c.name = String(m.name || 'Player').slice(0, 24);
        clients.set(c.id, c);
        if (role !== 'instructor') eng.addPlayer(role, c.name);
        sendTo(c, { t: 'joined', role: role, scene: eng.scene(), rationale: RATIONALE });
        pushView(c);
        room.broadcast();
        return;
      }
      if (!c.role) return;
      const isInstr = c.role === 'instructor';
      switch (m.t) {
        case 'order': {
          if (isInstr) return;
          const r = eng.order(c.role, m.order, m.rationale);
          sendTo(c, { t: 'orderResult', ok: r.ok, error: r.error, id: r.id });
          break;
        }
        case 'chat': if (!isInstr) eng.chat(c.role, m.text, m.share); break;
        case 'ctl': {
          if (!isInstr) return;
          switch (m.action) {
            case 'start': eng.start(); break;
            case 'pause': eng.pause(); break;
            case 'reset': eng.reset(m.seed); break;
            case 'speed': eng.setSpeed(m.value); break;
            case 'preset': eng.setPreset(m.value); break;
            case 'param': eng.setParam(m.ch, m.key, m.value); break;
            case 'scripted': eng.setScripted(m.value); break;
            case 'demo': eng.reset(); eng.setSpeed(m.speed || 6); eng.setDemo(true); eng.start(); break;
          }
          break;
        }
        case 'inject': if (isInstr) eng.inject(m); break;
        case 'getAar': sendTo(c, { t: 'aar', report: eng.aar() }); return;
        default: return;
      }
      room.broadcast();
    };
    // host calls this on a timer (every 250 ms of real time)
    room.step = function (dtReal) {
      eng.advance(dtReal);
      bcAcc += dtReal;
      if (bcAcc >= 0.5) { bcAcc = 0; room.broadcast(); }
    };
    return room;
  }

  return { createEngine: createEngine, createRoom: createRoom, SCENARIO: SCENARIO, ROLES: ROLES, CHANNELS: CHANNELS, PRESETS: PRESETS, RATIONALE: RATIONALE, fmtT: fmtT, gridRef: gridRef, dist: dist, BLAST: BLAST };
});

var app = { link: null, mode: 'local', server: null, role: null, name: '', scene: null, view: null, screen: 'lobby', aar: null,
  sel: { type: null, unit: 'B', target: null }, seen: {}, feedback: null, briefOpen: true, room: 'DEMO', aarTimer: null, themePref: 'auto' };
var qs = new URLSearchParams(location.search);

// ------------------------------------------------------------ links
function LocalLink() {
  var self = this;
  this.room = K.createRoom('LOCAL');
  this.client = { id: 'local', send: function (m) { setTimeout(function () { onMessage(m); }, 0); } };
  this.timer = setInterval(function () { self.room.step(0.25); }, 250);
  this.send = function (m) { self.room.handle(self.client, JSON.parse(JSON.stringify(m))); };
}
function WsLink(room) {
  var self = this, queue = [];
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var base = location.pathname.replace(/[^/]*$/, '');
  this.ws = new WebSocket(proto + location.host + base + 'ws?room=' + encodeURIComponent(room));
  this.ws.onopen = function () { queue.forEach(function (m) { self.ws.send(m); }); queue = []; };
  this.ws.onmessage = function (e) { try { onMessage(JSON.parse(e.data)); } catch (x) { /* ignore */ } };
  this.ws.onclose = function () { toast('Connection to the server closed. Reload to reconnect.'); };
  this.send = function (m) { var s = JSON.stringify(m); if (self.ws.readyState === 1) self.ws.send(s); else queue.push(s); };
}

function detectServer() {
  if (location.protocol === 'file:' || qs.get('mode') === 'local') return Promise.resolve(null);
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var to = setTimeout(function () { if (ctl) ctl.abort(); }, 1500);
  return fetch('api/ping', { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { clearTimeout(to); return j && j.name === 'kohra' ? j : null; }).catch(function () { clearTimeout(to); return null; });
}

function toast(text) {
  var t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.style.cssText = 'position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;z-index:9;font-size:13px;max-width:90vw'; document.body.appendChild(t); }
  t.textContent = text; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 4200);
}

// ------------------------------------------------------------ messages from room
function onMessage(m) {
  if (m.t === 'joined') {
    app.scene = m.scene; app.role = m.role; app.view = null;
    app.sel = { type: null, unit: 'B', target: null }; app.seen = {}; app.feedback = null; app._briefAuto = false; app.briefOpen = true;
    app.screen = m.role === 'instructor' ? 'instr' : 'trainee';
    stopAarTimer(); buildScreen();
  } else if (m.t === 'view') {
    app.view = m.view;
    if (app.screen === 'trainee' && m.view.kind === 'trainee') updateTrainee();
    else if (app.screen === 'instr' && m.view.kind === 'instructor') updateInstructor();
    updateHeader();
  } else if (m.t === 'orderResult') {
    app.feedback = m.ok ? { ok: true, text: 'Order sent. Wait for an acknowledgement.' } : { ok: false, text: m.error || 'Order refused.' };
    if (m.ok) { app.sel.target = null; }
    if (app.screen === 'trainee') { updateTrainee(true); }
  } else if (m.t === 'aar') {
    app.aar = m.report;
    if (app.screen === 'aar') renderAar();
  } else if (m.t === 'error') toast(m.text);
}

// ------------------------------------------------------------ header
function headerHtml() {
  var roleOpts = ['instructor'].concat(Object.keys(app.scene.roles)).map(function (r) {
    var label = r === 'instructor' ? 'Instructor' : app.scene.roles[r].label;
    return '<option value="' + r + '"' + (r === app.role ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
  return '<header class="top"><span class="brand">Kohra</span><span class="scn">' + esc(app.scene.name) + '</span>' +
    '<span class="clock" id="clock">T+00:00</span><span class="pill" id="status">Not started</span><span class="sp"></span>' +
    '<label class="small muted" for="roleSel">Playing as </label><select id="roleSel" aria-label="Switch role">' + roleOpts + '</select>' +
    '<button class="btn" id="aarBtn">After-action review</button>' +
    '<button class="btn" id="themeBtn" aria-label="Change theme">Theme: ' + app.themePref + '</button></header>';
}
function bindHeader() {
  $('#roleSel').onchange = function (e) { join(e.target.value); };
  $('#aarBtn').onclick = function () { if (app.screen === 'aar') backToExercise(); else openAar(); };
  $('#themeBtn').onclick = function () {
    var order = ['auto', 'light', 'dark'], i = (order.indexOf(app.themePref) + 1) % 3; app.themePref = order[i];
    if (app.themePref === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', app.themePref);
    $('#themeBtn').textContent = 'Theme: ' + app.themePref; refreshColors();
  };
}
function updateHeader() {
  var v = app.view; if (!v || !$('#clock')) return;
  $('#clock').textContent = fmtT(v.t);
  var st = $('#status');
  var txt = v.ended ? 'Ended' : v.running ? 'Running' + (v.speed !== 1 ? ' at ' + v.speed + 'x' : '') : (v.t > 0 ? 'Paused' : 'Not started');
  st.textContent = txt; st.className = 'pill' + (v.ended ? ' end' : v.running ? ' run' : '');
}

function join(role) {
  app.link.send({ t: 'join', role: role, name: app.name || 'Player' });
}
function buildScreen() {
  var root = $('#app');
  if (app.screen === 'trainee') root.innerHTML = headerHtml() + '<div class="main">' + traineeHtml() + '</div>';
  else if (app.screen === 'instr') root.innerHTML = headerHtml() + '<div class="main">' + instrHtml() + '</div>';
  bindHeader();
  if (app.screen === 'trainee') bindTrainee(); else if (app.screen === 'instr') bindInstr();
  initMap();
  if (app.view) { updateHeader(); if (app.screen === 'trainee') updateTrainee(true); else updateInstructor(true); }
}
function backToExercise() {
  stopAarTimer(); app.screen = app.role === 'instructor' ? 'instr' : 'trainee'; buildScreen();
}

// ------------------------------------------------------------ lobby
function renderLobby() {
  var s = app.server;
  var roles = [['instructor', 'Instructor', 'Run the exercise. Tune the degradation, inject jamming and spoofing, and watch decisions as they happen.']]
    .concat(Object.keys(K.ROLES).map(function (r) { return [r, K.ROLES[r].label, ROLE_BLURB[r]]; }));
  var modeLine = s
    ? 'Multiplayer server found. Everyone who joins room <b>' + esc(app.room) + '</b> plays the same exercise from their own device.'
    : 'No server found, so this runs on your device. You play one role at a time and can switch roles from the top bar. Use <b>Run demo</b> as instructor to watch a scripted team play.';
  $('#app').innerHTML = '<div class="main"><div class="lobby"><h1>Kohra</h1>' +
    '<p class="lede">Commanders rarely get the full picture. Kohra feeds each trainee delayed, missing and contradictory reports, then shows exactly what they knew when they decided.</p>' +
    '<p class="modeline">' + modeLine + '</p>' +
    '<div class="row"><label>Your name<input type="text" id="nm" maxlength="24" placeholder="Name" value="' + esc(app.name) + '"></label>' +
    (s ? '<label>Room code<input type="text" id="rm" maxlength="12" value="' + esc(app.room) + '"></label>' : '') + '</div>' +
    '<div class="roles">' + roles.map(function (r) {
      var who = s && s.rooms && s.rooms[app.room] && s.rooms[app.room][r[0]] ? s.rooms[app.room][r[0]] + ' connected' : '';
      return '<button class="role" data-role="' + r[0] + '"><span class="rn">' + esc(r[1]) + '</span><span class="rd">' + esc(r[2]) + '</span><span class="who">' + who + '</span></button>';
    }).join('') + '</div></div></div>';
  $$('.role').forEach(function (b) {
    b.onclick = function () {
      app.name = ($('#nm').value || '').trim() || (b.dataset.role === 'instructor' ? 'Instructor' : 'Trainee');
      if (s) { app.room = (($('#rm') && $('#rm').value) || 'DEMO').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'DEMO'; app.link = new WsLink(app.room); app.mode = 'ws'; }
      else { app.link = new LocalLink(); app.mode = 'local'; }
      join(b.dataset.role);
    };
  });
}

// ------------------------------------------------------------ trainee screen
function traineeHtml() {

    ? '<label id="unitWrap">Unit<select id="unit">' + app.scene.units.map(function (u) { return '<option value="' + u.id + '"' + (u.id === 'B' ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join('') + '</select></label>' : '';
  var rat = app.scene.rationale.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('');
  return '<div class="trainee">' +
    '<section class="stage" id="stage"><canvas id="map" aria-label="Tactical map"></canvas>' +
    '<div class="brief" id="brief"></div>' +
    '<div class="legend"><span><i style="background:var(--friendly)"></i>Your units</span><span><i style="background:var(--hostile);transform:rotate(45deg)"></i>Reported enemy (fades with age)</span><span>Dashed ring: where it could be by now</span></div></section>' +
    '<aside class="rail"><section class="panel"><h3>Links</h3><ul class="chans" id="chans"></ul></section>' +
    '<section class="panel grow"><h3>Reports and team messages</h3><ol class="log" id="log"></ol>' +
    '<form class="chatf" id="chatf"><input type="text" id="chat" maxlength="240" placeholder="Message the team" aria-label="Message the team"><button class="btn" type="submit">Send</button></form></section></aside>' +
    '<section class="panel orders" id="orders"><div class="cols"><div><h3>Orders</h3><div class="seg" id="acts">' + acts + '</div>' +
    '<div class="fields">' + unitSel + '<label>Why are you doing this?<select id="rat"><option value="">Choose a rationale</option>' + rat + '</select></label>' +
    '<label>Note (optional)<input type="text" id="note" maxlength="200" placeholder="One line"></label></div>' +
    '<div class="target" id="targetLine"></div><div id="hint" class="small muted"></div>' +
    '<div class="fields" style="margin-top:8px"><button class="btn primary" id="send">Send order</button><button class="btn sm" id="clearT">Clear target</button></div>' +
    '<div class="feedback" id="fb" aria-live="polite"></div></div>' +
    '<div><h3>Recent orders</h3><ul class="olist" id="olist"></ul></div></div></section></div>';
}
function bindTrainee() {
  $$('#acts button').forEach(function (b) {
    b.onclick = function () { app.sel.type = b.dataset.type; app.feedback = null; updateOrderUi(); };
  });
  var u = $('#unit'); if (u) u.onchange = function () { app.sel.unit = u.value; updateOrderUi(); };
  $('#clearT').onclick = function () { app.sel.target = null; updateOrderUi(); };
  $('#send').onclick = sendOrder;
  $('#chatf').onsubmit = function (e) { e.preventDefault(); var i = $('#chat'); if (!i.value.trim()) return; app.link.send({ t: 'chat', text: i.value }); i.value = ''; };
  $('#log').onclick = function (e) {
    var b = e.target.closest('button'); if (!b || !app.view) return;
    var msg = app.view.messages.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!msg || !msg.data.pos) return;
    if (b.dataset.act === 'target') {
      app.sel.target = { pos: msg.data.pos, cid: msg.data.cid, src: msg.src, sentAt: msg.sentAt };
      if (!app.sel.type) { var first = app.scene.roles[app.role].orders.filter(function (o) { return NEEDS_POS[o]; })[0]; if (first) app.sel.type = first; }
      updateOrderUi();
    } else if (b.dataset.act === 'share') {
      app.link.send({ t: 'chat', text: 'Passing on: ' + msg.text, share: { cid: msg.data.cid, pos: msg.data.pos, sentAt: msg.sentAt } });
      toast('Shared with the team over the team net. It may be delayed or lost.');
    }
  };
  $('#brief').onclick = function (e) { if (e.target.tagName === 'BUTTON') { app.briefOpen = !app.briefOpen; renderBrief(); } };
  renderBrief();
}
function renderBrief() {
  var b = $('#brief'); if (!b) return;
  b.innerHTML = '<button class="btn sm">' + (app.briefOpen ? 'Hide' : 'Brief') + '</button><b>' + esc(app.scene.name) + '</b>' +
    (app.briefOpen ? '<div>' + esc(app.scene.brief) + '</div><div class="muted" style="margin-top:4px">' + esc(ROLE_BLURB[app.role] || '') + '</div>' : '');
}
function sendOrder() {
  var s = app.sel, v = app.view;
  if (!s.type) { app.feedback = { ok: false, text: 'Choose an order first.' }; return updateOrderUi(); }
  var rat = $('#rat').value;
  if (!rat) { app.feedback = { ok: false, text: 'Choose a rationale. It goes into the after-action review.' }; return updateOrderUi(); }
  var ord = { type: s.type };
  if (NEEDS_UNIT[s.type]) ord.unit = s.unit;
  if (NEEDS_POS[s.type]) { if (!s.target) { app.feedback = { ok: false, text: 'Click the map or choose a report to set the target.' }; return updateOrderUi(); } ord.pos = s.target.pos; ord.cid = s.target.cid || null; }
  app.link.send({ t: 'order', order: ord, rationale: { tag: rat, note: $('#note').value } });
  $('#note').value = '';
}
function ownInBlast(pos, exceptUnit) {
  var hit = [];
  if (!app.view) return hit;
  app.view.units.forEach(function (u) { if (u.alive && u.id !== exceptUnit && K.dist([u.x, u.y], pos) <= app.scene.blast) hit.push(u.name); });
  return hit;
}
function updateOrderUi() {
  var s = app.sel, v = app.view;
  $$('#acts button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.type === s.type ? 'true' : 'false'); });
  var uw = $('#unitWrap'); if (uw) uw.style.display = !s.type || NEEDS_UNIT[s.type] ? '' : 'none';
  var h = $('#hint'); if (h) h.textContent = s.type ? ORDER_HINT[s.type] : 'Choose an order to begin.';
  var line = '';
  if (s.type && NEEDS_POS[s.type]) {
    if (!s.target) line = 'No target yet. Click the map, or press "Use as target" on a report.';
    else {
      var pos = s.target.pos, t = v ? v.t : 0;
      line = 'Target: <b>' + K.gridRef(pos) + '</b>' + (s.target.cid ? ' (' + esc(s.target.cid) + ', from ' + esc(s.target.src) + ', ' + fmtAge(t - s.target.sentAt) + ' old)' : ' (map point)');
      if (s.type === 'fire' || s.type === 'strike') {
        var own = ownInBlast(pos, s.type === 'fire' ? s.unit : null);
        if (own.length) line += '<div class="warn">Your own forces are inside the blast radius: ' + esc(own.join(', ')) + '.</div>';
        if (s.type === 'fire' && v) { var u = v.units.filter(function (x) { return x.id === s.unit; })[0]; if (u && K.dist([u.x, u.y], pos) > app.scene.fireRange) line += '<div class="warn">' + esc(u.name) + ' is out of range of this target.</div>'; }
      }
    }
  }
  $('#targetLine').innerHTML = line;
  var fb = $('#fb'); if (fb) { fb.textContent = app.feedback ? app.feedback.text : ''; fb.className = 'feedback' + (app.feedback && !app.feedback.ok ? ' err' : ''); }
  var send = $('#send'); if (send) send.disabled = !!(v && (v.ended || !v.running));
}
function updateTrainee(force) {
  var v = app.view; if (!v || v.kind !== 'trainee') return;
  if (v.running && !app._briefAuto) { app._briefAuto = true; app.briefOpen = false; renderBrief(); }
  // channels
  var rel = ['radio', 'datalink', 'cybernet', 'spectrum', 'teamnet'];
  $('#chans').innerHTML = v.channels.map(function (c) {
    var age = c.lastHeard == null ? null : v.t - c.lastHeard;
    var frac = age == null ? 0 : Math.max(0, 1 - age / 90), cls = age == null || age > 60 ? 'low' : age > 25 ? 'mid' : '';
    return '<li><span>' + esc(app.scene.channels[c.ch].label) + '</span><span class="bar ' + cls + '"><span style="width:' + Math.round(frac * 100) + '%"></span></span><span class="age">' + (age == null ? 'nothing yet' : fmtAge(age) + ' ago') + '</span></li>';
  }).join('');
  // log (newest first); rebuild only when message set changed
  var key = v.messages.length ? v.messages[v.messages.length - 1].id + ':' + v.messages.length : '0';
  if (force || key !== app._logKey) {
    app._logKey = key;
    var first = Object.keys(app.seen).length === 0;
    $('#log').innerHTML = v.messages.slice().reverse().map(function (m) {
      var fresh = !first && !app.seen[m.id];
      var late = m.recvAt - m.sentAt;
      var acts = m.data && m.data.pos ? '<div class="acts"><button class="btn sm" data-act="target" data-id="' + m.id + '">Use as target</button><button class="btn sm" data-act="share" data-id="' + m.id + '">Share with team</button></div>' : '';
      return '<li class="msg ch-' + m.ch + (fresh ? ' fresh' : '') + '"><div class="meta"><span class="src' + (m.src.indexOf('Unconfirmed') === 0 ? ' unc' : '') + '">' + esc(m.src) + '</span><span>' +
        (m.mine ? fmtT(m.sentAt) : 'sent ' + fmtAge(m.sentAt) + (late >= 8 ? ' (' + Math.round(late) + ' s late)' : '')) + '</span></div><p>' + esc(m.text) + '</p>' + acts + '</li>';
    }).join('') || '<li class="muted small">Nothing received yet. Start the exercise from the Instructor screen.</li>';
    v.messages.forEach(function (m) { app.seen[m.id] = 1; });
  }
  // recent orders
  $('#olist').innerHTML = v.orders.slice().reverse().map(function (o) {
    var age = v.t - o.t, st = o.ackedAt != null ? '<span class="st ok">acknowledged</span>' : age > 45 ? '<span class="st noack">no acknowledgement</span>' : '<span class="st wait">waiting</span>';
    return '<li><span>' + fmtT(o.t) + ' ' + esc(o.text) + '</span>' + st + '</li>';
  }).join('') || '<li class="muted">No orders yet.</li>';
  // units dropdown: mark casualties
  var u = $('#unit'); if (u) $$('option', u).forEach(function (o) { var un = v.units.filter(function (x) { return x.id === o.value; })[0]; if (un) o.textContent = un.name + (un.alive ? '' : ' (out of action)'); });
  updateOrderUi();
}

function bindInstr() {
  $('#runBtn').onclick = function () { app.link.send({ t: 'ctl', action: app.view && app.view.running ? 'pause' : 'start' }); };
  $('#speed').onchange = function (e) { app.link.send({ t: 'ctl', action: 'speed', value: +e.target.value }); };
  $('#resetBtn').onclick = function () { app.link.send({ t: 'ctl', action: 'reset' }); };
  $('#demoBtn').onclick = function () { app.link.send({ t: 'ctl', action: 'demo', speed: 6 }); toast('Demo running at 6x. Open the after-action review when it ends.'); };
  $('#scripted').onchange = function (e) { app.link.send({ t: 'ctl', action: 'scripted', value: e.target.checked }); };
  $$('#presets button').forEach(function (b) { b.onclick = function () { app.link.send({ t: 'ctl', action: 'preset', value: b.dataset.preset }); }; });
  var deb = {};
  $$('#sliders input').forEach(function (inp) {
    inp.oninput = function () {
      var k = inp.dataset.ch + inp.dataset.key; clearTimeout(deb[k]);
      deb[k] = setTimeout(function () { var val = +inp.value; if (inp.dataset.key !== 'delay') val = val / 100; app.link.send({ t: 'ctl', action: 'param', ch: inp.dataset.ch, key: inp.dataset.key, value: val }); }, 120);
    };
  });
  $$('[data-inj]').forEach(function (b) {
    b.onclick = function () {
      var kind = b.dataset.inj, dur = kind === 'outage' ? 45 : 60;
      app.link.send({ t: 'inject', kind: kind, ch: b.dataset.ch, dur: dur, strength: 0.9 });
    };
  });
}
function scoreClass(s) { return s == null ? 'na' : s >= 75 ? 'hi' : s >= 50 ? 'mid' : 'lo'; }

function chartSvg(r) {

  var X = function (t) { return L + (W - L - R) * t / maxT; }, Y = function (e) { return T + (H - T - B) * (1 - Math.min(e, maxE) / maxE); };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Belief error per role over time">';
  for (var e = 0; e <= maxE; e += 10) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(e) + '" y2="' + Y(e) + '" stroke="var(--line)" stroke-width="0.7"/><text x="' + (L - 6) + '" y="' + (Y(e) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink2)">' + e + '</text>';
  for (var t = 0; t <= maxT; t += 60) s += '<text x="' + X(t) + '" y="' + (H - 12) + '" text-anchor="' + (t >= maxT ? 'end' : 'middle') + '" font-size="11" fill="var(--ink2)">' + fmtT(t) + '</text>';
  eventList(r).forEach(function (ev, i) { s += '<line x1="' + X(ev.t) + '" x2="' + X(ev.t) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="' + (ev.kind === 'degrade' ? 'var(--warn)' : ev.kind === 'bad' ? 'var(--bad)' : 'var(--ok)') + '" stroke-dasharray="4 4" stroke-width="1"/>'; });
  Object.keys(r.series).forEach(function (role) {
    var seg = [], pts = r.series[role], d = '';
    pts.forEach(function (p) { if (p.err == null) { if (seg.length) { d += 'M' + seg.join('L'); seg = []; } } else seg.push(X(p.t).toFixed(1) + ' ' + Y(p.err).toFixed(1)); });
    if (seg.length) d += 'M' + seg.join('L');
    if (d) s += '<path d="' + d + '" fill="none" stroke="' + ROLE_COLOR[role] + '" stroke-width="2.2"/>';
  });
  s += '</svg><div class="keys">' + Object.keys(r.series).map(function (k) { return '<span><i style="background:' + ROLE_COLOR[k] + '"></i>' + esc(app.scene.roles[k].short) + '</span>'; }).join('') +
    '<span><i style="background:var(--warn)"></i>Degradation began</span><span><i style="background:var(--ok)"></i>Enemy destroyed</span><span><i style="background:var(--bad)"></i>Failure or fratricide</span></div>';
  return s;
}
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function aarCsv(rep) {
  var head = ['id', 't', 'role', 'order', 'rationale', 'note', 'transit_s', 'status', 'outcome', 'detail', 'score', 'label', 'confidence', 'freshest_report_age_s', 'belief_error', 'contradictory_reports'];
  var rows = rep.decisions.map(function (d) { var k = d.knowledge || {}; return [d.id, d.t, d.role, d.text, d.rationale.tag, d.rationale.note, d.transit, d.status, d.outcome ? d.outcome.kind : '', d.outcome ? d.outcome.detail : '', d.score, d.label, k.confidence, k.freshestAge, k.beliefError, k.contradictory]; });
  return [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\n');
}
function download(name, text, type) {
  try {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('If nothing downloaded, use "Show CSV text" and copy it from the box.');
  } catch (e) { toast('Download is not available here. Use "Show CSV text" and copy it.'); }
}

  app.server = info; if (info && qs.get('room')) app.room = qs.get('room').toUpperCase();
  app.scene = { name: 'Op Ridge Crossing' };
  renderLobby();
});
window.__kohra = app; // handy for debugging and tests
})();
